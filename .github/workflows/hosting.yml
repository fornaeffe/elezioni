name: Hosting reassessment and Pages

on:
  push:
    branches: [migrazione, main]
  workflow_dispatch:
    inputs:
      extended:
        description: Run the optional extended application matrix
        type: boolean
        default: false
      publish:
        description: Publish the validated main revision (also requires PAGES_PUBLICATION_ENABLED=true)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hosting-${{ github.ref }}
  cancel-in-progress: false

jobs:
  development:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: 'true'
      ACCEPTANCE_UNIT_WORKERS: '2'
      ACCEPTANCE_BROWSER_WORKERS: '1'
      ACCEPTANCE_OUTPUT: ../data/derived/development-acceptance
    defaults:
      run:
        working-directory: web
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare production assets for fixture UI and data validation
        run: |
          mkdir -p ../data/derived/development-acceptance
          if ! npm run data:prepare -- --download > ../data/derived/development-acceptance/prepare.log 2>&1; then
            tail -c 3500 ../data/derived/development-acceptance/prepare.log
            exit 1
          fi
      - name: Types, units and development browser checks
        run: npm run acceptance:dev
      - name: Preserve development evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: development-evidence-${{ github.sha }}
          retention-days: 1
          include-hidden-files: true
          path: data/derived/development-acceptance/

  reassess:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # Cold validates the application; warm verifies regenerated byte identity.
    timeout-minutes: 330
    env:
      CI: 'true'
      ACCEPTANCE_PROFILE: ${{ inputs.extended && 'extended' || 'release' }}
      # No Actions cache is restored: every run establishes a genuine cold pass.
      # The second pass reuses the same npm, original-source and fitted caches.
      npm_config_cache: /tmp/elezioni-hosting-npm
    defaults:
      run:
        working-directory: web
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check explicit publication request
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          PUBLICATION_ENABLED: ${{ vars.PAGES_PUBLICATION_ENABLED }}
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' || "$PUBLICATION_ENABLED" != 'true' ]]; then
            echo 'Publication requires main and PAGES_PUBLICATION_ENABLED=true.' >&2
            exit 1
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Cold dependency installation
        run: |
          mkdir -p ../data/derived/hosting/cold
          if ! /usr/bin/time -v -o ../data/derived/hosting/cold/install-resources.txt npm ci > ../data/derived/hosting/cold/install.log 2>&1; then
            tail -c 3500 ../data/derived/hosting/cold/install.log
            exit 1
          fi
      - name: Install acceptance browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Cold preparation, validation, builds and staged-site acceptance
        run: npm run hosting:reassess -- cold
      - name: Warm dependency installation
        run: |
          mkdir -p ../data/derived/hosting/warm
          if ! /usr/bin/time -v -o ../data/derived/hosting/warm/install-resources.txt npm ci > ../data/derived/hosting/warm/install.log 2>&1; then
            tail -c 3500 ../data/derived/hosting/warm/install.log
            exit 1
          fi
      - name: Warm regeneration and identical production-payload check
        run: npm run hosting:reassess -- warm
      - name: Preserve small hosting receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hosting-summary-${{ github.sha }}
          retention-days: 30
          path: |
            data/derived/hosting/cold/report.json
            data/derived/hosting/cold/prepare-report.json
            data/derived/hosting/cold/check-report.json
            data/derived/hosting/warm/report.json
            data/derived/hosting/warm/prepare-report.json
            data/derived/hosting/warm/check-report.json
      - name: Preserve complete acceptance evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hosting-evidence-${{ github.sha }}
          retention-days: 1
          include-hidden-files: true
          path: |
            data/derived/hosting/
            !data/derived/hosting/*/site/**
            data/derived/cp08-browser/
            web/test-results/
      - name: Upload validated Pages tree
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' && vars.PAGES_PUBLICATION_ENABLED == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: data/derived/hosting/warm/site
          retention-days: 1

  deploy:
    needs: reassess
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' && vars.PAGES_PUBLICATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish validated main revision
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  public-smoke:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      BASE_PATH: /elezioni
      HOSTING_URL: ${{ needs.deploy.outputs.url }}
      HOSTING_EXPECTED_REVISION: ${{ github.sha }}
      PLAYWRIGHT_JSON_OUTPUT_NAME: ../data/derived/hosting/public-browser.json
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify deployed revision, routes, workers, simulation and exports
        run: npm run test:hosting -- --reporter=json
      - name: Preserve public-site evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: public-site-evidence-${{ github.sha }}
          retention-days: 1
          path: data/derived/hosting/
      - name: Preserve public summary and transfer receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: public-site-summary-${{ github.sha }}
          retention-days: 30
          path: |
            data/derived/hosting/public-browser.json
            data/derived/hosting/public-transfers/
